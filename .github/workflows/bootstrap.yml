name: Bootstrap
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check repository infrastructure (not Android)
        run: python3 scripts/check.py
      - name: Check first-party whitespace
        run: git show --format= --check HEAD -- . ':!.agents/skills/navigation-3' ':!.agents/skills/testing-setup' ':!.agents/skills/adaptive' ':!.agents/skills/edge-to-edge'
